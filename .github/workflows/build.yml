name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Show environment
        run: |
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/build-tools" || true

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Locate artifacts
        run: |
          find app/build/outputs -type f -name "*.apk" -print

      - name: Sign APK
        run: |
          set -e
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          echo "using build-tools $BT"
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/release.keystore" \
            -alias raccoon \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass raccoon123 -keypass raccoon123 \
            -dname "CN=Raccoon, OU=Dev, O=Raccoon, L=Hangzhou, ST=Zhejiang, C=CN"
          UNSIGNED=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "unsigned: $UNSIGNED"
          "$ANDROID_HOME/build-tools/$BT/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-pass pass:raccoon123 \
            --key-pass pass:raccoon123 \
            --out "$RUNNER_TEMP/raccoon-chatglm.apk" \
            "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$RUNNER_TEMP/raccoon-chatglm.apk" || true
          cp "$RUNNER_TEMP/raccoon-chatglm.apk" ./raccoon-chatglm.apk
          ls -la ./raccoon-chatglm.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: raccoon-chatglm-apk
          path: raccoon-chatglm.apk
          if-no-files-found: error

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
          if-no-files-found: ignore
